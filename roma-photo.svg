<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ROMA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f0f13"/>
      <stop offset="45%" stop-color="#5a2b2e"/>
      <stop offset="100%" stop-color="#25181a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f8ff"/>
      <stop offset="100%" stop-color="#b8bed6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="270" cy="270" r="78" fill="#f8c38f" opacity="0.92"/>
  <polygon points="120,680 520,260 910,680" fill="#4c474f"/>
  <polygon points="455,360 520,260 595,385 520,430" fill="#dedede"/>

