  <text x="182" y="700" font-family="Arial Black, Impact, sans-serif" font-size="170" fill="#f7f7f7" opacity="0.95">RO</text>
  <text x="622" y="700" font-family="Arial Black, Impact, sans-serif" font-size="170" fill="#f7f7f7" opacity="0.95">MA</text>

  <rect x="494" y="260" width="60" height="110" rx="8" fill="#2f3138"/>
  <rect x="514" y="330" width="20" height="520" fill="url(#blade)" filter="url(#glow)"/>

  <rect x="0" y="0" width="1024" height="1024" fill="none" stroke="#000" stroke-opacity="0.24" stroke-width="22"/>
</svg>
